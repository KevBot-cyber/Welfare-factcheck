name: welfareNews-daily-live-scan

on:
  schedule:
    - cron: '0 7 * * *'  # 7am GMT / 8am BST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install rss-parser
      - name: Run scanner with running total
        run: node scripts/scan-welfareNews-live.js
      - name: Commit updated log
        run: |
          git config user.name "【entity-github¦canonical_name=GitHub】-actions"
          git config user.email "actions@【entity-github.com¦canonical_name=GitHub】"
          git add data/welfareNews_live_log.json public/data/welfareNews_live_log.json
          git diff --staged --quiet || git commit -m "auto: update live feed $(date -u +%Y-%m-%d)"
          git push

name: Daily Welfare Stigma Scan on: schedule: - cron: '0 7 * * *' # 7am UK daily workflow_dispatch: permissions: contents: write jobs: scan: runs-on: ubuntu-latest steps: - name: Checkout repo uses: actions/checkout@v4 with: fetch-depth: 0 - name: Setup Node uses: actions/setup-node@v4 with: node-version: 20 - name: Install deps run: npm install rss-parser@3.13.0 --no-save || npm install rss-parser --no-save - name: Run stigma scan run: node scripts/scan-stigma.js - name: Commit log if changed run: | git config user.name "WelfareFacts Bot" git config user.email "bot@welfarefacts.org.uk" git add data/stigma-log.json data/stigmaTerms.json if git diff --cached --quiet; then echo "No changes to commit" exit 0 fi git commit -m "auto: update stigma incidents $(date +%Y-%m-%d)" git push
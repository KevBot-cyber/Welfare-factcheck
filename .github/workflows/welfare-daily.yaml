name: Welfare Watch Daily Auto-Scan
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/daily-scan.js
        env:
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
          GUARDIAN_KEY: ${{ secrets.GUARDIAN_KEY }}
          CURRENTS_KEY: ${{ secrets.CURRENTS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      - name: Commit updated archive
        run: |
          git config user.name "welfare-watch-bot"
          git config user.email "bot@welfaretruth.index"
          git add public/data/welfare-archive.json
          git add public/data/ || true
          git commit -m "Daily welfare scan $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
